name: mobileLLM unsigned IPA

# Produces an UNSIGNED iphoneos/arm64 Release .app packaged as mobileLLM.ipa, for re-signing with
# Windows AltServer. No Apple Developer certificate is used or required.
#
# Tag-only trigger: push `mobile-ipa-*` to run. The llama.cpp XCFramework is built from source at the
# commit pinned in scripts/build-llama-xcframework.sh (~15-25 min), so this is deliberately not a
# per-commit workflow. That XCFramework is cached (see the cache-key comment below) so repeat runs
# skip the verbose build entirely; DerivedData is never cached.

on:
  push:
    tags: ["mobile-ipa-*"]

permissions:
  contents: read

jobs:
  unsigned-ipa:
    name: unsigned iphoneos arm64 IPA
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          # The Xcode major version is part of the XCFramework cache key: a new toolchain can change
          # how llama.cpp's Metal shaders and archives are produced, so a cached slice from an older
          # Xcode must not be reused silently.
          echo "xcode_major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Install build tooling
        run: brew install xcodegen cmake

      - name: Restore the vendored llama.cpp XCFramework
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: Packages/LLMEngineLlama/Vendor/llama.xcframework
          # Every input that can change the produced framework is in the key: runner OS + arch (the
          # slices are host-produced), the Xcode major version, and the contents of the build script
          # (which pins the llama.cpp commit) and the package manifest (which names the binary target
          # the framework must satisfy). Any edit to either file changes the key and forces a rebuild.
          key: llama-xcframework-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.toolchain.outputs.xcode_major }}-${{ hashFiles('scripts/build-llama-xcframework.sh', 'Packages/LLMEngineLlama/Package.swift') }}

      - name: Confirm the restored XCFramework is usable
        id: llama-cache-check
        run: |
          XCF="Packages/LLMEngineLlama/Vendor/llama.xcframework"
          if [ "${{ steps.llama-cache.outputs.cache-hit }}" = "true" ] && [ -f "$XCF/Info.plist" ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
            echo "cache HIT — reusing $XCF"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "cache MISS — the XCFramework will be built from source"
          fi

      - name: Build the vendored llama.cpp XCFramework
        if: steps.llama-cache-check.outputs.usable != 'true'
        run: ./scripts/build-llama-xcframework.sh

      - name: Cache summary
        run: |
          echo "key            = llama-xcframework-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.toolchain.outputs.xcode_major }}-${{ hashFiles('scripts/build-llama-xcframework.sh', 'Packages/LLMEngineLlama/Package.swift') }}"
          echo "cache-hit      = ${{ steps.llama-cache.outputs.cache-hit }}"
          echo "xcframework    = $(du -sh Packages/LLMEngineLlama/Vendor/llama.xcframework 2>/dev/null | cut -f1)"

      - name: Provide the signing xcconfig base configuration
        # project.yml registers Signing.xcconfig as the Debug/Release base config, but the file is
        # gitignored. The template only carries an empty DEVELOPMENT_TEAM — no credentials — and
        # nothing is signed here anyway; it exists so xcodegen does not emit a missing base config.
        run: cp Signing.xcconfig.example Signing.xcconfig

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app (Release, iphoneos, arm64, unsigned)
        run: |
          xcodebuild -project mobileLLM.xcodeproj -scheme mobileLLM \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            -derivedDataPath build \
            MTL_COMPILER_FLAGS='$(inherited) -Wno-c++17-extensions -Wno-c++20-extensions' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload/mobileLLM.app into mobileLLM.ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/mobileLLM.app"
          test -d "$APP"
          rm -rf Payload mobileLLM.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry mobileLLM.ipa Payload

      - name: Verify the IPA is unsigned, arm64 and correctly identified
        run: |
          set -euo pipefail
          APP="Payload/mobileLLM.app"
          BIN="$APP/mobileLLM"
          status=0

          echo "--- bundle layout ---"
          ls -1 "$APP"
          echo "--- nested Frameworks ---"
          ls -1 "$APP/Frameworks" 2>/dev/null || echo "(no Frameworks directory)"

          echo "--- main binary architectures ---"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q 'arm64' || { echo "::error::main binary is not arm64"; status=1; }

          echo "--- platform (build product path) ---"
          SRC="build/Build/Products/Release-iphoneos/mobileLLM.app"
          case "$SRC" in
            *Release-iphoneos*) echo "ok: packaged from $SRC";;
          esac
          test -d "$SRC" || { echo "::error::$SRC is missing"; status=1; }

          echo "--- platform (Mach-O LC_BUILD_VERSION) ---"
          xcrun vtool -show-build "$BIN" | grep -E 'platform|minos|sdk' || true
          xcrun vtool -show-build "$BIN" | grep -q 'platform IOS' \
            || { echo "::error::not an iphoneos Mach-O"; status=1; }

          echo "--- bundle identifier ---"
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")"
          echo "CFBundleIdentifier = $BUNDLE_ID"
          [ "$BUNDLE_ID" = "wang.wangdongdong.mobileLLM" ] \
            || { echo "::error::unexpected bundle id $BUNDLE_ID"; status=1; }

          echo "--- signature artifacts (must be absent) ---"
          if [ -e "$APP/_CodeSignature" ]; then
            echo "::error::$APP/_CodeSignature is present — the app is signed"
            status=1
          else
            echo "ok: no _CodeSignature in the app bundle"
          fi
          if [ -e "$APP/embedded.mobileprovision" ]; then
            echo "::error::$APP/embedded.mobileprovision is present"
            status=1
          else
            echo "ok: no embedded.mobileprovision"
          fi
          if find Payload -name '_CodeSignature' -o -name 'embedded.mobileprovision' | grep -q .; then
            echo "::error::a nested bundle is signed:"
            find Payload \( -name '_CodeSignature' -o -name 'embedded.mobileprovision' \)
            status=1
          else
            echo "ok: no nested signature artifacts anywhere in Payload/"
          fi

          echo "--- codesign verdict (informational) ---"
          codesign -dv "$BIN" 2>&1 || echo "(binary carries no signature)"

          echo "--- ipa ---"
          du -h mobileLLM.ipa

          exit "$status"

      - name: Upload the unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: mobileLLM-unsigned-ipa
          path: mobileLLM.ipa
          if-no-files-found: error
          retention-days: 30
