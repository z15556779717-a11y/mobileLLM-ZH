name: mobileLLM unsigned IPA

# Produces an UNSIGNED iphoneos/arm64 Release .app packaged as mobileLLM.ipa, for re-signing with
# Windows AltServer. No Apple Developer certificate is used or required.
#
# Tag-only trigger: push `mobile-ipa-*` to run.
#
# The llama.cpp XCFramework is a ~20 min source build and is gitignored, so it is published ONCE as a
# Release asset bound to the llama.cpp commit pinned in scripts/build-llama-xcframework.sh, and every
# later run downloads it. A Release asset is not scoped to the ref that created it, which is exactly
# what actions/cache cannot offer here: caches are per-ref, so a run on one mobile-ipa-* tag can never
# restore a cache saved by another. DerivedData is never published or reused.

on:
  push:
    tags: ["mobile-ipa-*"]

permissions:
  contents: write # publish and read the pinned XCFramework Release asset

jobs:
  unsigned-ipa:
    name: unsigned iphoneos arm64 IPA
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install build tooling
        run: brew install xcodegen cmake

      - name: Resolve the pinned llama.cpp commit
        id: llama
        run: |
          # The pin lives in the build script, so the asset release tag is derived from it: bumping
          # the commit automatically looks for a different asset and rebuilds when it is absent.
          COMMIT="$(sed -n 's/^LLAMA_COMMIT="\([^"]*\)"$/\1/p' scripts/build-llama-xcframework.sh)"
          test -n "$COMMIT" || { echo "::error::LLAMA_COMMIT not found in scripts/build-llama-xcframework.sh"; exit 1; }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=llama-xcframework-$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Restore the pinned llama.xcframework from its Release asset
        id: llama-asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          XCF="Packages/LLMEngineLlama/Vendor/llama.xcframework"
          rm -rf "$XCF" /tmp/llama-asset
          mkdir -p "$(dirname "$XCF")" /tmp/llama-asset
          if gh release download "${{ steps.llama.outputs.tag }}" \
               --repo "$GITHUB_REPOSITORY" \
               --pattern 'llama.xcframework.zip' \
               --dir /tmp/llama-asset --clobber; then
            unzip -q /tmp/llama-asset/llama.xcframework.zip -d /tmp/llama-asset/unpacked \
              || echo "the asset archive did not unpack"
            # Only trust the asset once it proves it is a real XCFramework; a corrupt or truncated
            # download falls through to a source build instead of failing later in xcodebuild.
            if [ -f /tmp/llama-asset/unpacked/llama.xcframework/Info.plist ]; then
              mv /tmp/llama-asset/unpacked/llama.xcframework "$XCF"
            fi
          else
            echo "no Release asset published yet for ${{ steps.llama.outputs.tag }}"
          fi
          if [ -f "$XCF/Info.plist" ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
            echo "asset HIT — reused the pinned llama.xcframework at ${{ steps.llama.outputs.commit }}"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "asset MISS — building llama.cpp from source at ${{ steps.llama.outputs.commit }}"
          fi

      - name: Build the vendored llama.cpp XCFramework
        if: steps.llama-asset.outputs.usable != 'true'
        run: ./scripts/build-llama-xcframework.sh

      - name: Publish the XCFramework for the pinned commit
        if: steps.llama-asset.outputs.usable != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.llama.outputs.tag }}"
          rm -f /tmp/llama.xcframework.zip
          ( cd Packages/LLMEngineLlama/Vendor && zip -qry /tmp/llama.xcframework.zip llama.xcframework )
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --latest=false \
              --title "llama.xcframework for llama.cpp ${{ steps.llama.outputs.commit }}" \
              --notes "Pinned llama.cpp XCFramework consumed by .github/workflows/mobile-ipa.yml so that mobile-ipa-* tag runs skip the ~20 min source build. Built by $(xcodebuild -version | head -1). A build artifact, not a source release."
          fi
          gh release upload "$TAG" /tmp/llama.xcframework.zip --repo "$GITHUB_REPOSITORY" --clobber

      - name: Asset summary
        run: |
          echo "llama.cpp commit = ${{ steps.llama.outputs.commit }}"
          echo "asset release    = ${{ steps.llama.outputs.tag }}"
          echo "asset reused     = ${{ steps.llama-asset.outputs.usable }}"
          echo "xcframework      = $(du -sh Packages/LLMEngineLlama/Vendor/llama.xcframework 2>/dev/null | cut -f1)"

      - name: Provide the signing xcconfig base configuration
        # project.yml registers Signing.xcconfig as the Debug/Release base config, but the file is
        # gitignored. The template only carries an empty DEVELOPMENT_TEAM — no credentials — and
        # nothing is signed here anyway; it exists so xcodegen does not emit a missing base config.
        run: cp Signing.xcconfig.example Signing.xcconfig

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app (Release, iphoneos, arm64, unsigned)
        run: |
          xcodebuild -project mobileLLM.xcodeproj -scheme mobileLLM \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            -derivedDataPath build \
            MTL_COMPILER_FLAGS='$(inherited) -Wno-c++17-extensions -Wno-c++20-extensions' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload/mobileLLM.app into mobileLLM.ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/mobileLLM.app"
          test -d "$APP"
          rm -rf Payload mobileLLM.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry mobileLLM.ipa Payload

      - name: Verify the IPA is unsigned, arm64 and correctly identified
        run: |
          set -euo pipefail
          APP="Payload/mobileLLM.app"
          BIN="$APP/mobileLLM"
          status=0

          echo "--- bundle layout ---"
          ls -1 "$APP"
          echo "--- nested Frameworks ---"
          ls -1 "$APP/Frameworks" 2>/dev/null || echo "(no Frameworks directory)"

          echo "--- main binary architectures ---"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q 'arm64' || { echo "::error::main binary is not arm64"; status=1; }

          echo "--- platform (build product path) ---"
          SRC="build/Build/Products/Release-iphoneos/mobileLLM.app"
          case "$SRC" in
            *Release-iphoneos*) echo "ok: packaged from $SRC";;
          esac
          test -d "$SRC" || { echo "::error::$SRC is missing"; status=1; }

          echo "--- platform (Mach-O LC_BUILD_VERSION) ---"
          xcrun vtool -show-build "$BIN" | grep -E 'platform|minos|sdk' || true
          xcrun vtool -show-build "$BIN" | grep -q 'platform IOS' \
            || { echo "::error::not an iphoneos Mach-O"; status=1; }

          echo "--- bundle identifier ---"
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")"
          echo "CFBundleIdentifier = $BUNDLE_ID"
          [ "$BUNDLE_ID" = "wang.wangdongdong.mobileLLM" ] \
            || { echo "::error::unexpected bundle id $BUNDLE_ID"; status=1; }

          echo "--- signature artifacts (must be absent) ---"
          if [ -e "$APP/_CodeSignature" ]; then
            echo "::error::$APP/_CodeSignature is present — the app is signed"
            status=1
          else
            echo "ok: no _CodeSignature in the app bundle"
          fi
          if [ -e "$APP/embedded.mobileprovision" ]; then
            echo "::error::$APP/embedded.mobileprovision is present"
            status=1
          else
            echo "ok: no embedded.mobileprovision"
          fi
          if find Payload -name '_CodeSignature' -o -name 'embedded.mobileprovision' | grep -q .; then
            echo "::error::a nested bundle is signed:"
            find Payload \( -name '_CodeSignature' -o -name 'embedded.mobileprovision' \)
            status=1
          else
            echo "ok: no nested signature artifacts anywhere in Payload/"
          fi

          echo "--- codesign verdict (informational) ---"
          codesign -dv "$BIN" 2>&1 || echo "(binary carries no signature)"

          echo "--- ipa ---"
          du -h mobileLLM.ipa

          exit "$status"

      - name: Upload the unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: mobileLLM-unsigned-ipa
          path: mobileLLM.ipa
          if-no-files-found: error
          retention-days: 30
